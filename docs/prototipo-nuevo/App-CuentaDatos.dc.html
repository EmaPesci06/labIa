    <form style="margin: 0; padding: 16px; border-radius: 22px; background: #FFFFFF; display: flex; flex-direction: column; gap: 12px">

      </div>
      <div style="display: flex; flex-direction: column; gap: 4px">
        <label for="barrio" style="font-size: 16px; font-weight: 700">Barrio</label>
        <select id="barrio" style="height: 50px; padding: 0 14px; border: 2px solid #123B4A; border-radius: 16px; background: #FFFFFF; color: #123B4A; font: inherit; font-size: 17px"><option selected>La Perla</option><option>Centro</option><option>Chauvin</option><option>Los Troncos</option></select>
      </div>

      <h2 id="d2" style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 800">Cómo ingresás</h2>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 14px">Email</span><span style="font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis">marta@ejemplo.com</span></span>
        <button style="min-height: 44px; padding: 0 14px; border: 2px solid #123B4A; border-radius: 14px; background: transparent; color: #123B4A; font: inherit; font-size: 15px; font-weight: 700">Cambiar</button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">

      </div>
