<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B2730; color: #FFF3D6; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 12px 20px 0">

  </header>

  <form style="flex: 1; margin: 0; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <label style="padding: 14px 16px; border-radius: 20px; background: #17485A; display: flex; align-items: center; gap: 14px">

      <input type="checkbox" checked style="width: 28px; height: 28px; flex: none; margin: 0; accent-color: #45C4CC">
    </label>
    <label style="padding: 14px 16px; border-radius: 20px; background: #17485A; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Me eligieron para un trabajo</span><span style="font-size: 14px">Para que no se te pase escribirle al cliente.</span></span>
      <input type="checkbox" checked style="width: 28px; height: 28px; flex: none; margin: 0; accent-color: #45C4CC">
    </label>
    <label style="padding: 14px 16px; border-radius: 20px; background: #17485A; display: flex; align-items: center; gap: 14px">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Me dejaron una reseña</span><span style="font-size: 14px">Con el puntaje y lo que escribieron.</span></span>
      <input type="checkbox" style="width: 28px; height: 28px; flex: none; margin: 0; accent-color: #45C4CC">
    </label>
    <div style="padding: 14px 16px; border: 3px dashed #FFF3D6; border-radius: 20px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 17px; font-weight: 700">Avisos de tu cuenta</span>
      <span style="font-size: 14px; line-height: 1.4">Verificación, seguridad y cambios en las normas. Estos llegan siempre: no se pueden apagar.</span>
    </div>
  </form>

  <footer style="padding: 10px 20px 16px; background: #17485A; border-radius: 28px 28px 0 0">
    <button style="width: 100%; min-height: 56px; border: 0; border-radius: 18px; background: #45C4CC; color: #0B2730; font: inherit; font-size: 18px; font-weight: 700">Guardar preferencias</button>
