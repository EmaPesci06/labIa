<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ingresar, modo oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;touch-action:manipulation}
h1,h2{text-wrap:balance}
a{color:#FFF3D6}a:hover{color:#45C4CC}
:focus-visible{outline:3px solid #F7C948;outline-offset:2px}
button:hover{filter:brightness(1.1)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B2730; color: #FFF3D6; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <span aria-hidden="true" style="height: 26px; background: repeating-linear-gradient(90deg, #45C4CC 0 26px, #17485A 26px 52px)"></span>
  <header style="padding: 12px 20px 0">
    <a href="Oscuro-Bienvenida.dc.html" translate="no" style="min-height: 44px; display: inline-flex; align-items: center; font-family: 'Baloo 2', sans-serif; font-size: 30px; font-weight: 800; color: #45C4CC; text-decoration: none">LabÍA</a>
    <h1 style="margin: 14px 0 0; font-family: 'Baloo 2', sans-serif; font-size: 42px; line-height: 1; font-weight: 800">¡Hola de nuevo!</h1>
  </header>

  <form style="margin: 0; padding: 22px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <button type="button" style="min-height: 56px; border: 2px solid #FFF3D6; border-radius: 18px; background: #17485A; color: #FFF3D6; font: inherit; font-size: 17px; font-weight: 700">Seguir con Google</button>
    <div aria-hidden="true" style="display: flex; align-items: center; gap: 12px; font-size: 15px"><span style="flex: 1; height: 2px; background: #17485A"></span>o con tu email<span style="flex: 1; height: 2px; background: #17485A"></span></div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="email" style="font-size: 16px; font-weight: 700">Email</label>
      <input id="email" type="email" autocomplete="email" value="carla@ejemplo.com" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="pass" style="font-size: 16px; font-weight: 700">Contraseña</label>
      <div style="display: flex; gap: 8px">
        <input id="pass" type="password" autocomplete="current-password" aria-describedby="pass-error" aria-invalid="true" value="12345678" style="flex: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border: 3px solid #FF9A8F; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
        <button type="button" style="min-height: 52px; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: transparent; color: #FFF3D6; font: inherit; font-size: 15px; font-weight: 700">Ver</button>
      </div>
      <span id="pass-error" style="font-size: 15px; font-weight: 700; color: #FF9A8F">El email o la contraseña no coinciden.</span>
    </div>
    <button style="min-height: 56px; border: 0; border-radius: 18px; background: #45C4CC; color: #0B2730; font: inherit; font-size: 18px; font-weight: 700">Ingresar</button>
    <a href="Oscuro-Restablecer.dc.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 16px; font-weight: 700">Me olvidé la contraseña</a>
  </form>

  <footer style="margin-top: auto; padding: 16px 20px 20px; background: #17485A; border-radius: 28px 28px 0 0; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 16px">¿Primera vez?</span>
    <a href="Oscuro-Bienvenida.dc.html" style="min-height: 48px; padding: 0 20px; display: flex; align-items: center; border: 3px solid #FFF3D6; border-radius: 18px; text-decoration: none; font-size: 16px; font-weight: 700">Crear cuenta</a>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
