</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B2730; color: #FFF3D6; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 10px 20px 14px; background: #17485A; color: #FFFFFF; border-radius: 0 0 28px 28px">
    <a href="Oscuro-AdminVerificaciones.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 12H4M11 5l-7 7 7 7"></path></svg>Verificaciones</a>
    <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 30px; line-height: 1; font-weight: 800">Marta Rodríguez</h1>
    <p style="margin: 4px 0 0; font-size: 15px">Plomería y gas · La Perla · espera hace 3 días</p>
  </header>

  <main style="flex: 1; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <nav aria-label="Documentos" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button aria-pressed="true" style="min-height: 44px; border: 0; border-radius: 22px; background: #F7C948; color: #123B4A; font: inherit; font-size: 15px; font-weight: 700">DNI</button>
      <button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 22px; background: #17485A; color: #FFF3D6; font: inherit; font-size: 15px">Antecedentes</button>
      <button aria-pressed="false" style="min-height: 44px; border: 0; border-radius: 22px; background: #17485A; color: #FFF3D6; font: inherit; font-size: 15px">Matrícula</button>
    </nav>
    <div role="img" aria-label="Documento: DNI, frente" style="height: 196px; border-radius: 18px; background: #17485A; border: 2px solid #FFF3D6; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 12px; font-size: 14px"><span style="align-self: flex-end; padding: 4px 10px; border-radius: 12px; background: #F7C948; color: #123B4A; font-weight: 700; font-variant-numeric: tabular-nums">El enlace vence en 42 s</span><span>DNI, frente (1 de 2)</span></div>
    <div style="display: flex; justify-content: space-between">
      <button style="min-height: 44px; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 14px; background: transparent; color: #FFF3D6; font: inherit; font-size: 15px; font-weight: 700">Ver el dorso</button>
      <button style="min-height: 44px; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 14px; background: transparent; color: #FFF3D6; font: inherit; font-size: 15px; font-weight: 700">Pedir otro enlace</button>
    </div>

    <fieldset style="margin: 0; padding: 10px 14px; border: 0; border-radius: 18px; background: #17485A; display: flex; flex-direction: column">
      <legend style="float: left; width: 100%; padding: 0; font-size: 15px; font-weight: 700">Lo marcás mientras revisás. No se guarda.</legend>
      <label style="clear: both; min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #45C4CC">Se lee completo y sin reflejos</label>
      <label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px"><input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; accent-color: #45C4CC">El nombre coincide con el del perfil</label>
      <label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 16px"><input type="checkbox" style="width: 22px; height: 22px; margin: 0; accent-color: #45C4CC">Es mayor de 18</label>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="motivo" style="font-size: 15px; font-weight: 700">Si rechazás, el motivo que le llega</label>
      <select id="motivo" style="height: 48px; padding: 0 12px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 16px"><option selected>Elegí un motivo</option><option>Foto borrosa</option><option>No se ve completo</option><option>Certificado vencido (más de 90 días)</option><option>El nombre no coincide</option><option>Tiene antecedentes que impiden publicar</option><option>Otro</option></select>
    </div>
  </main>

  <footer style="padding: 10px 20px 16px; background: #17485A; border-radius: 28px 28px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button style="min-height: 56px; border: 3px solid #FF9A8F; border-radius: 18px; background: #0B2730; color: #FF9A8F; font: inherit; font-size: 17px; font-weight: 700">Rechazar el DNI</button>
    <button style="min-height: 56px; border: 0; border-radius: 18px; background: #45C4CC; color: #0B2730; font: inherit; font-size: 17px; font-weight: 700">Aprobar el DNI</button>
  </footer>
</div>
