:focus-visible{outline:3px solid #F7C948;outline-offset:2px}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B2730; color: #FFF3D6; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 16px 20px 16px; background: #F7C948; color: #123B4A; border-radius: 0 0 28px 28px">
    <ol aria-label="Pasos del registro" style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; font-size: 14px; font-weight: 700">
      <li aria-current="step" style="padding-top: 6px; border-top: 6px solid #123B4A">1 · Perfil</li>
      <li style="padding-top: 6px; border-top: 6px solid #17485A">2 · Documentos</li>
      <li style="padding-top: 6px; border-top: 6px solid #17485A">3 · Normas</li>
    </ol>
    <h1 style="margin: 12px 0 0; font-family: 'Baloo 2', sans-serif; font-size: 34px; line-height: 1; font-weight: 800">Armá tu perfil</h1>
    <p style="margin: 6px 0 0; font-size: 16px">Es lo que ven los vecinos cuando te encuentran.</p>
  </header>

  <form style="flex: 1; margin: 0; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 14px">
      <div role="img" aria-label="Sin foto de perfil" style="width: 72px; height: 72px; flex: none; box-sizing: border-box; border-radius: 50%; background: #17485A; border: 3px dashed #FFF3D6"></div>
      <button type="button" style="min-height: 48px; padding: 0 18px; border: 3px solid #FFF3D6; border-radius: 18px; background: transparent; color: #FFF3D6; font: inherit; font-size: 16px; font-weight: 700">Subir tu foto</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="nombre" style="font-size: 16px; font-weight: 700">Nombre y apellido</label>
      <input id="nombre" type="text" autocomplete="name" value="Marta Rodríguez" aria-describedby="nombre-ayuda" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
      <span id="nombre-ayuda" style="font-size: 14px">En tu perfil se muestra como “Marta R.”</span>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 16px; font-weight: 700">¿Qué oficios hacés?</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #0E7C86; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Plomería</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #0E7C86; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Gas</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Electricidad</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Cerrajería</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Pintura</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Carpintería</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Mecánica</label>
      </div>
      <p style="margin: 6px 0 0; font-size: 14px">Para gas te vamos a pedir la matrícula.</p>
    </fieldset>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="base" style="font-size: 16px; font-weight: 700">Barrio desde donde salís</label>
      <select id="base" style="height: 50px; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px"><option selected>La Perla</option><option>Centro</option><option>Chauvin</option><option>Los Troncos</option></select>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="sobre" style="font-size: 16px; font-weight: 700">Contá qué arreglás</label>
      <textarea id="sobre" rows="2" style="height: 76px; box-sizing: border-box; padding: 10px 14px; border: 2px solid #FFF3D6; border-radius: 16px; resize: none; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px; line-height: 1.4">Pérdidas, destapaciones, termotanques y cambio de cañerías.</textarea>
    </div>
  </form>

  <footer style="padding: 10px 20px 16px; background: #17485A; border-radius: 28px 28px 0 0">
    <a href="Oscuro-ProDocumentos.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; background: #45C4CC; color: #0B2730; text-decoration: none; font-size: 18px; font-weight: 700">Seguir con los documentos</a>
  </footer>
</div>
