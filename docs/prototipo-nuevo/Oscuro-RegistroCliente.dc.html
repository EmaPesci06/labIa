<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Registro de cliente, modo oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;touch-action:manipulation}
h1,h2{text-wrap:balance}
a{color:#FFF3D6}a:hover{color:#45C4CC}
:focus-visible{outline:3px solid #F7C948;outline-offset:2px}
button:hover{filter:brightness(1.1)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B2730; color: #FFF3D6; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <span aria-hidden="true" style="height: 26px; background: repeating-linear-gradient(90deg, #45C4CC 0 26px, #17485A 26px 52px)"></span>
  <header style="padding: 8px 20px 0">
    <a href="Oscuro-Bienvenida.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 12H4M11 5l-7 7 7 7"></path></svg>Volver</a>
    <h1 style="margin: 2px 0 0; font-family: 'Baloo 2', sans-serif; font-size: 36px; line-height: 1; font-weight: 800">Creá tu cuenta</h1>
  </header>

  <form style="flex: 1; margin: 0; padding: 14px 20px 0; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
    <button type="button" style="min-height: 52px; border: 2px solid #FFF3D6; border-radius: 18px; background: #17485A; color: #FFF3D6; font: inherit; font-size: 17px; font-weight: 700">Seguir con Google</button>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="nombre" style="font-size: 16px; font-weight: 700">Nombre</label>
      <input id="nombre" type="text" autocomplete="given-name" value="Carla" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="email" style="font-size: 16px; font-weight: 700">Email</label>
      <input id="email" type="email" autocomplete="email" value="carla@ejemplo.com" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="pass" style="font-size: 16px; font-weight: 700">Contraseña</label>
      <input id="pass" type="password" autocomplete="new-password" aria-describedby="pass-ayuda" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
      <span id="pass-ayuda" style="font-size: 14px">Al menos 8 caracteres.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="wa" style="font-size: 16px; font-weight: 700">Tu WhatsApp</label>
      <input id="wa" type="tel" autocomplete="tel" placeholder="223 555 0123" aria-describedby="wa-ayuda" style="height: 50px; box-sizing: border-box; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px">
      <span id="wa-ayuda" style="font-size: 14px">Lo ven solo los profesionales que elijas.</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="barrio" style="font-size: 16px; font-weight: 700">Tu barrio</label>
      <select id="barrio" aria-describedby="barrio-ayuda" style="height: 50px; padding: 0 14px; border: 2px solid #FFF3D6; border-radius: 16px; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px"><option selected>La Perla</option><option>Centro</option><option>Chauvin</option><option>Los Troncos</option><option>Punta Mogotes</option></select>
      <span id="barrio-ayuda" style="font-size: 14px">Nunca te pedimos la dirección.</span>
    </div>
    <label style="min-height: 44px; display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.3"><input type="checkbox" style="width: 24px; height: 24px; flex: none; margin: 0; accent-color: #45C4CC"><span>Soy mayor de 18 y acepto los <a href="Oscuro-Legal.dc.html">términos</a> y la <a href="Oscuro-Legal.dc.html">privacidad</a>.</span></label>
  </form>

  <footer style="padding: 10px 20px 14px; display: flex; flex-direction: column">
    <button style="min-height: 56px; border: 0; border-radius: 18px; background: #45C4CC; color: #0B2730; font: inherit; font-size: 18px; font-weight: 700">Crear cuenta</button>
    <a href="Oscuro-ProPerfil.dc.html" style="align-self: center; min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700">¿Ofrecés un oficio? Registrate como profesional</a>
  </footer>
</div>
</x-dc>

</body>
</html>
