<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Editar mi perfil público, modo oscuro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;touch-action:manipulation}
h1,h2{text-wrap:balance}
a{color:#FFF3D6}a:hover{color:#45C4CC}
:focus-visible{outline:3px solid #F7C948;outline-offset:2px}
button:hover{filter:brightness(1.1)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B2730; color: #FFF3D6; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="padding: 12px 20px 0; display: flex; flex-direction: column">
    <a href="Oscuro-Cuenta.dc.html" style="align-self: flex-start; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-size: 15px; font-weight: 700"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 12H4M11 5l-7 7 7 7"></path></svg>Mi cuenta</a>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 34px; line-height: 1; font-weight: 800">Mi perfil público</h1>
      <a href="Oscuro-Perfil.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; font-weight: 700">Ver cómo se ve</a>
    </div>
  </header>

  <form style="flex: 1; margin: 0; padding: 12px 20px 0; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 14px">
      <div role="img" aria-label="Tu foto de perfil" style="width: 72px; height: 72px; flex: none; box-sizing: border-box; border-radius: 50%; background: #17485A; border: 5px solid #F7C948; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-size: 30px; font-weight: 800">M</div>
      <button type="button" style="min-height: 48px; padding: 0 18px; border: 3px solid #FFF3D6; border-radius: 18px; background: transparent; color: #FFF3D6; font: inherit; font-size: 16px; font-weight: 700">Cambiar la foto</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="sobre" style="font-size: 16px; font-weight: 700">Qué arreglás</label>
      <textarea id="sobre" rows="3" aria-describedby="sobre-ayuda" style="height: 96px; box-sizing: border-box; padding: 10px 14px; border: 2px solid #FFF3D6; border-radius: 16px; resize: none; background: #0B2730; color: #FFF3D6; font: inherit; font-size: 17px; line-height: 1.4">Pérdidas, destapaciones, termotanques y cambio de cañerías.</textarea>
      <span id="sobre-ayuda" style="font-size: 14px">Sin teléfonos, emails ni direcciones: te escriben por WhatsApp desde el botón.</span>
    </div>
    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 16px; font-weight: 700">Barrios donde trabajás</legend>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #0E7C86; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">La Perla</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #0E7C86; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Centro</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #0E7C86; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700"><input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Chauvin</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Los Troncos</label>
        <label style="min-height: 46px; padding: 0 14px; border-radius: 23px; background: #17485A; display: flex; align-items: center; gap: 8px; font-size: 16px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #45C4CC">Punta Mogotes</label>
      </div>
    </fieldset>
    <fieldset style="margin: 0; padding: 0; border: 0">
      <legend style="padding: 0; margin-bottom: 6px; font-size: 16px; font-weight: 700">Fotos de trabajos (3 de 6)</legend>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <div role="img" aria-label="Foto de un trabajo" style="height: 78px; border-radius: 14px; background: #F7C948; color: #123B4A"></div>
        <div role="img" aria-label="Foto de un trabajo" style="height: 78px; border-radius: 14px; background: #17485A"></div>
        <div role="img" aria-label="Foto de un trabajo" style="height: 78px; border-radius: 14px; background: #F7C948; color: #123B4A"></div>
        <button type="button" style="height: 78px; border: 3px dashed #FFF3D6; border-radius: 14px; background: transparent; color: #FFF3D6; font: inherit; font-size: 15px; font-weight: 700">Sumar</button>
      </div>
    </fieldset>
    <p style="margin: 0; font-size: 14px; line-height: 1.4">Los oficios no se cambian desde acá: si sumás uno, lo revisamos de nuevo.</p>
  </form>

  <footer style="padding: 10px 20px 16px; background: #17485A; border-radius: 28px 28px 0 0">
    <button style="width: 100%; min-height: 56px; border: 0; border-radius: 18px; background: #45C4CC; color: #0B2730; font: inherit; font-size: 18px; font-weight: 700">Guardar cambios</button>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

renderVals() {
return {};
}
}
</script>
</body>
</html>
