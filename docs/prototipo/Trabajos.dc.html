<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LabÍA · Trabajos disponibles</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&amp;family=Atkinson+Hyperlegible+Next:wght@400..800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:3px solid #D45F3A;outline-offset:2px}
@keyframes cinta{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
a{color:#232F49}a:hover{color:#182136}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #F1F3F6; color: #1B2438; font-family: 'Atkinson Hyperlegible Next', sans-serif">
  <div style="flex: 1; padding: 24px 20px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <img src="/_blob/304edbcb89bf94400a05ef24027583ab" alt="labia" style="height: 32px; width: auto">
      <span style="width: 40px; height: 40px; border-radius: 999px; background: #B84A25; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center">MG</span>
    </div>

    <div style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: #FBE5DC; color: #1B2438; font-size: 14px; line-height: 1.4">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9A3A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      Estamos revisando tu DNI y tus antecedentes. Ya podés ver trabajos.
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 118%; font-weight: 800; font-size: 28px; letter-spacing: -0.5px">Trabajos para vos</h1>
      <span style="font-size: 14px; color: #4B5468">Gas, Plomería · La Perla, Centro</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{jobs}}" as="j" hint-placeholder-count="3">
        <a href="DetalleTrabajo.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 18px; background: #FFFFFF; color: #1B2438; text-decoration: none">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: #232F49">{{j.tag}}</span>
            <span style="font-size: 13px; color: #565F72">{{j.when}}</span>
          </div>
          <span style="font-size: 17px; font-weight: 700">{{j.title}}</span>
          <span style="font-size: 14px; color: #4B5468; line-height: 1.4">{{j.desc}}</span>
          <span style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="display: block; flex: none; height: 12px; width: {{j.tape}}; border-radius: 2px; border-right: 3px solid #232F49; box-sizing: border-box; background: repeating-linear-gradient(90deg, #232F49 0 1.5px, transparent 1.5px 40px) 0 0 / 100% 7px no-repeat, repeating-linear-gradient(90deg, #232F49 0 1px, transparent 1px 8px) 0 0 / 100% 4px no-repeat, #D45F3A"></span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #1B2438">a {{j.km}}</span></span><div style="display: flex; gap: 6px; flex-wrap: wrap">
            <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{j.urgBg}}; color: {{j.urgFg}}">{{j.urg}}</span>
            <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: #EEF0F3; color: #4B5468">{{j.count}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="Navegación" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #DDE0E6; background: #FFFFFF; padding: 8px 8px 20px">
    <a href="Trabajos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #B84A25; font-size: 12px; font-weight: 700; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      Trabajos
    </a>
    <a href="DetalleTrabajo.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #565F72; font-size: 12px; font-weight: 600; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H8l-4 4z"></path></svg>
      Postulaciones
    </a>
    <a href="Perfil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 48px; justify-content: center; color: #565F72; font-size: 12px; font-weight: 600; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
      Mi perfil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const raw = [
{ tag: 'GAS · LA PERLA', when: 'Hace 20 min', km: '0,8 km', tape: '24px', title: 'Olor a gas en la cocina', desc: 'Desde ayer hay olor cerca del horno. Ya cerré la llave de paso.', urgent: true, count: '2 postulantes' },
{ tag: 'PLOMERÍA · CENTRO', when: 'Hace 2 h', km: '2,1 km', tape: '63px', title: 'Cambiar canilla del baño', desc: 'Gotea aunque esté cerrada. Tengo la canilla nueva.', urgent: false, urg: 'Esta semana', count: 'Sin postulantes' },
{ tag: 'GAS · LA PERLA', when: 'Ayer', km: '1,5 km', tape: '45px', title: 'Instalar calefactor tiro balanceado', desc: 'Calefactor nuevo de 5000 kcal para el living.', urgent: false, urg: 'Sin apuro', count: '1 postulante' }
];
return {
jobs: raw.map((j) => ({
...j,
urg: j.urgent ? 'Lo antes posible' : j.urg,
urgBg: j.urgent ? '#FBE5DC' : '#E6E9F0',
urgFg: j.urgent ? '#9A3A17' : '#232F49'
}))
};
}
}
</script>
</body>
</html>
