<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LabÍA · Publicar un trabajo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&amp;family=Atkinson+Hyperlegible+Next:wght@400..800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:3px solid #D45F3A;outline-offset:2px}
@keyframes cinta{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
a{color:#232F49}a:hover{color:#182136}
</style>
</helmet>
<div style="width: 390px; height: 1040px; box-sizing: border-box; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 18px; background: #F1F3F6; color: #1B2438; font-family: 'Atkinson Hyperlegible Next', sans-serif">
  <div style="display: flex; align-items: center; gap: 6px">
    <a href="Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #1B2438">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 118%; font-weight: 800; font-size: 26px">Publicar un trabajo</h1>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">¿Qué oficio necesitás?
    <select style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #CDD2DB; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 16px; color: #1B2438">
      <option>Gas</option>
      <option>Electricidad</option>
      <option>Plomería</option>
      <option>Cerrajería</option>
      <option>Carpintería</option>
      <option>Pintura</option>
      <option>Mecánica</option>
    </select>
  </label>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Título
    <input type="text" placeholder="Ej: Olor a gas en la cocina" style="min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid #CDD2DB; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 16px; color: #1B2438">
  </label>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Contá qué pasa
    <textarea rows="4" placeholder="Desde ayer hay olor a gas cerca del horno. Ya cerré la llave de paso." style="padding: 12px 14px; border-radius: 12px; border: 1px solid #CDD2DB; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 16px; color: #1B2438; resize: none"></textarea>
  </label>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Barrio
    <select style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #CDD2DB; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 16px; color: #1B2438">
      <option>La Perla</option>
      <option>Centro</option>
      <option>Chauvín</option>
      <option>Los Troncos</option>
    </select>
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 14px; font-weight: 600">¿Para cuándo?</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{cuando}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="min-height: 44px; padding: 0 14px; border-radius: 999px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.bd}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>

  <button type="button" style="min-height: 72px; border-radius: 14px; border: 1.5px dashed #A3A9B6; background: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-size: 15px; font-weight: 600; color: #1B2438; cursor: pointer">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#232F49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="m21 17-5-5-8 7"></path></svg>
    Agregar fotos (opcional)
  </button>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Presupuesto estimado (opcional)
    <input type="text" placeholder="$" style="min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid #CDD2DB; background: #FFFFFF; font: inherit; font-weight: 400; font-size: 16px; color: #1B2438">
  </label>

  <a href="MisTrabajos.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #232F49; color: #FFFFFF; font-weight: 700; font-size: 16px; text-decoration: none">Publicar trabajo</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { cuando: 'Lo antes posible' };
}
renderVals() {
const opts = ['Lo antes posible', 'Esta semana', 'Sin apuro'];
return {
cuando: opts.map((label) => {
const on = this.state.cuando === label;
return {
label: label,
on: on ? 'true' : 'false',
bg: on ? '#232F49' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#1B2438',
bd: on ? '#232F49' : '#CDD2DB',
pick: () => this.setState({ cuando: label })
};
})
};
}
}
</script>
</body>
</html>
