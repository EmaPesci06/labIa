<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LabÍA · Mis trabajos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&amp;family=Atkinson+Hyperlegible+Next:wght@400..800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
:focus-visible{outline:3px solid #D45F3A;outline-offset:2px}
@keyframes cinta{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
a{color:#232F49}a:hover{color:#182136}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 16px; background: #F1F3F6; color: #1B2438; font-family: 'Atkinson Hyperlegible Next', sans-serif">
  <div style="display: flex; align-items: center; gap: 6px">
    <a href="Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #1B2438">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: Archivo, sans-serif; font-stretch: 118%; font-weight: 800; font-size: 26px">Mis trabajos</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 18px; background: #FFFFFF">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.4px; color: #232F49">GAS · LA PERLA</span>
      <span style="padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{statusBg}}; color: {{statusFg}}">{{status}}</span>
    </div>
    <div style="font-size: 18px; font-weight: 700">Olor a gas en la cocina</div>
    <div style="font-size: 14px; color: #4B5468">Publicado hoy · Lo antes posible · 3 postulantes</div>
  </div>

  <sc-if value="{{hasHired}}" hint-placeholder-val="{{ false }}">
    <div style="padding: 14px 16px; border-radius: 14px; background: #DCEFE4; color: #1B2438; font-size: 15px; line-height: 1.4">Elegiste a <strong>{{hiredName}}</strong>. Escribile por WhatsApp para coordinar. Cuando termine, dejale una reseña.</div>
  </sc-if>

  <h2 style="margin: 4px 0 0; font-size: 17px; font-weight: 700">Postulantes</h2>
  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{postulantes}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 18px; background: #FFFFFF">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="flex: none; width: 46px; height: 46px; border-radius: 999px; background: #E6E9F0; color: #232F49; font-weight: 800; display: flex; align-items: center; justify-content: center">{{p.ini}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex: 1">
            <span style="font-size: 16px; font-weight: 700">{{p.name}}</span>
            <span style="font-size: 13px; color: #4B5468">{{p.sub}}</span>
          </div>
        </div>
        <div style="font-size: 15px; line-height: 1.45; color: #1B2438">“{{p.msg}}”</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <a href="Perfil.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 12px; border: 1.5px solid #232F49; color: #232F49; font-weight: 700; font-size: 14px; text-decoration: none">Ver perfil</a>
          <button type="button" onClick="{{p.pick}}" style="min-height: 44px; border-radius: 12px; border: none; background: {{p.btnBg}}; color: #FFFFFF; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer">{{p.btn}}</button>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { hired: null };
}
renderVals() {
const list = [
{ ini: 'MG', name: 'Martín Gómez', sub: 'Gasista matriculado · 4,9 estrellas', msg: 'Puedo ir hoy a las 17 h. Reviso la pérdida y te paso presupuesto en el momento.' },
{ ini: 'JP', name: 'Jorge Paz', sub: 'Gasista matriculado · 4,7 estrellas', msg: 'Mañana a primera hora estoy por La Perla. Llevo detector de pérdidas.' },
{ ini: 'SR', name: 'Silvia Romero', sub: 'Gas y plomería · 4,8 estrellas', msg: 'Te puedo dar un turno el jueves por la tarde.' }
];
const hired = this.state.hired;
return {
postulantes: list.map((p) => ({
...p,
btn: hired === p.name ? 'Elegido' : 'Elegir',
btnBg: hired === p.name ? '#1D6B45' : '#B84A25',
pick: () => this.setState({ hired: p.name })
})),
hasHired: !!hired,
hiredName: hired || '',
status: hired ? 'Contratado' : 'Abierto',
statusBg: hired ? '#DCEFE4' : '#E6E9F0',
statusFg: hired ? '#14532D' : '#232F49'
};
}
}
</script>
</body>
</html>
