name: Preparar el proyecto
description: pnpm (versión de packageManager) + Node de .nvmrc con caché del store, e instalación con el lockfile congelado.

runs:
  using: composite
  steps:
    - name: Instalar pnpm
      uses: pnpm/action-setup@v6

    - name: Instalar Node (.nvmrc) con caché de pnpm
      uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependencias
      shell: bash
      run: pnpm install --frozen-lockfile
