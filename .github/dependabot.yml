version: 2
updates:
  # pnpm usa el ecosistema "npm". Las versiones quedan exactas (sin ^), como pide la guía.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: "deps"
    labels: [dependencias]
    groups:
      menores:
        update-types: [minor, patch]
    ignore:
      # Fijo en 4.13.0 hasta rehacer la interfaz tras el MVP (LAB-64).
      - dependency-name: "@axe-core/playwright"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: "ci"
    labels: [dependencias]
    groups:
      menores:
        update-types: [minor, patch]
